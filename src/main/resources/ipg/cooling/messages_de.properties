about.title=Info
about.header=Wasserkühlung des Lasers
about.body=Rechner für die Wasserkühlung von IPG-Lasern: Wärme, Plattenhydraulik und Spezifikationswerte.\n\nDie Kühlplatte kommt aus dem Katalog (Rohr und Serpentine nach Zeichnung). Der Volumenstrom wird nicht eingegeben — das Programm löst ihn aus dem Chillereingangsdruck: ΔP = P_in − P_out.\n\nBerechnet:\n• Spezifikation — P_max = P/η, S_max = P_max/PF, Kälteleistung Q = P/η − P, empfohlener Volumenstrom 5 L/min je kW Laserleistung;\n• Wärmeübertrager — Geschwindigkeit, Re, α, Wassererwärmung, T_w, T_Al, ΔP und örtlicher Verlustbeiwert K;\n• thermische Zeitkonstante der Platte τ.\n\nSprachen: Russisch, Englisch, Deutsch.\n{1}\nVersion {0}
