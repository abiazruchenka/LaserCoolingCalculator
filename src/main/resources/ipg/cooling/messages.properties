about.title=About
about.header=Laser Water Cooling
about.body=Desktop calculator for IPG water-cooled lasers and cast cooling plates.\n\nPick a plate from the catalog (tube and serpentine from the drawing). Flow is not typed in: the program solves it from the chiller inlet pressure so that ΔP = P_in − P_out.\n\nIt reports:\n• specification — P_max = P/η, S_max = P_max/PF, chiller capacity Q = P/η − P, recommended flow 5 L/min per kW of laser output;\n• heat sink — velocity, Reynolds number, α, water rise, T_w, T_Al, ΔP and local-loss K;\n• plate time constant τ.\n\nLanguages: Russian, English, German.\n{1}\nVersion {0}
