about.title=О программе
about.header=Охлаждение лазера водой
about.body=Калькулятор водяного охлаждения лазеров IPG: тепло, гидравлика плиты и строки спецификации.\n\nПлита берётся из каталога (трубка и змеевик с чертежа). Расход вручную не задаётся — программа находит его из давления чиллера: ΔP = P_in − P_out.\n\nСчитает:\n• спецификацию — P_max = P/η, S_max = P_max/PF, холодопроизводительность Q = P/η − P, рекомендуемый расход 5 л/мин на кВт выходной мощности;\n• теплоотвод — скорость, Re, α, нагрев воды, T_w, T_Al, ΔP и местные потери K;\n• тепловую постоянную времени плиты τ.\n\nЯзыки: русский, английский, немецкий.\n{1}\nВерсия {0}
